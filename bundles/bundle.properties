# Items
item.cryogenic-frontiers-glacite.name=Glacite
item.cryogenic-frontiers-glacite.description=A resilient cold-forged dense iron-ice mineral. The fundamental structural building block of cryogenic technology.

item.cryogenic-frontiers-cryo-shale.name=Cryo-Shale
item.cryogenic-frontiers-cryo-shale.description=A dense, conductive ballistic mineral extracted from sub-zero bedrock strata. Replaces lead in heavy munition loads and electrical wiring.

item.cryogenic-frontiers-boreonite.name=Boreonite
item.cryogenic-frontiers-boreonite.description=A volatile cryogenic hydrocarbon mineral rich in trapped reactive gases. Highly flammable and serves as the primary thermal fuel source.

item.cryogenic-frontiers-polar-quartz.name=Polar Quartz
item.cryogenic-frontiers-polar-quartz.description=High-purity glacial silica crystal extracted from permafrost veins. Essential precursor for synthesis into microchips and reinforced glassware.

item.cryogenic-frontiers-subzero-silicon.name=Subzero Silicon
item.cryogenic-frontiers-subzero-silicon.description=A precision cryogenic semiconductor crystal forged by purifying Polar Quartz with Cryo-Shale. Powers advanced logic boards and autonomous drone navigation.

item.cryogenic-frontiers-cryo-glass.name=Cryo-Glass
item.cryogenic-frontiers-cryo-glass.description=Supercooled, high-tensile insulated glass forged from Polar Quartz and Glacite. Highly resistant to extreme pressure and cryogenic liquid erosion.

item.cryogenic-frontiers-cryo-crystal.name=Cryo-Crystal
item.cryogenic-frontiers-cryo-crystal.description=A dense, supercooled crystalline matrix synthesized by crystallizing Polar Quartz and Boreonite with Chilled Water. Emits an intense sub-zero field.

item.cryogenic-frontiers-cryo-alloy.name=Cryo-Alloy
item.cryogenic-frontiers-cryo-alloy.description=A superconducting ultra-dense composite alloy forged under cryogenic compression from Glacite, Subzero Silicon, and Cryo-Crystals. Immune to thermal stress and possessing immense tensile strength.

# Environment - Ores
block.cryogenic-frontiers-ore-glacite.name=Glacite Ore
block.cryogenic-frontiers-ore-cryo-shale.name=Cryo-Shale Ore
block.cryogenic-frontiers-ore-boreonite.name=Boreonite Ore
block.cryogenic-frontiers-ore-polar-quartz.name=Polar Quartz Ore

# Blocks - Production & Refineries
block.cryogenic-frontiers-cryo-synthesizer.name=Cryo-Synthesizer
block.cryogenic-frontiers-cryo-synthesizer.description=Refines Polar Quartz and Cryo-Shale into Subzero Silicon semiconductor crystals for advanced electronics and circuitry.

block.cryogenic-frontiers-cryo-glass-kiln.name=Cryo-Glass Kiln
block.cryogenic-frontiers-cryo-glass-kiln.description=Fuses Polar Quartz and Glacite under cryogenic vacuum compression into high-tensile insulated Cryo-Glass.

block.cryogenic-frontiers-cryo-crystallizer.name=Cryo-Crystallizer
block.cryogenic-frontiers-cryo-crystallizer.description=Pressurizes Polar Quartz, Boreonite, and Chilled Water into dense solid Cryo-Crystals under cryogenic temperatures.

block.cryogenic-frontiers-industrial-cryo-crystallizer.name=Industrial Cryo-Crystallizer
block.cryogenic-frontiers-industrial-cryo-crystallizer.description=A massive, high-capacity crystallization facility. Uses cryogenic flash-compression to rapidly crystallize Polar Quartz, Boreonite, and Chilled Water into large batches of Cryo-Crystals at high efficiency.

block.cryogenic-frontiers-cryo-alloy-foundry.name=Cryo-Alloy Foundry
block.cryogenic-frontiers-cryo-alloy-foundry.description=Compresses and supercools Glacite, Subzero Silicon, and Cryo-Crystals into superconducting Cryo-Alloy plates using high-pressure chilled water baths.

block.cryogenic-frontiers-cryo-freezer.name=Cryo Freezer
block.cryogenic-frontiers-cryo-freezer.description=Condenses ambient atmospheric vapor and supercools it into Chilled Water using high-efficiency cryogenic compression loops.

block.cryogenic-frontiers-cryo-drill.name=Cryo Drill
block.cryogenic-frontiers-cryo-drill.description=A supercooled rotary mining drill. Employs cryogenic fracturing to extract ores rapidly with minimal thermal wear. Can be boosted with Chilled Water.

block.cryogenic-frontiers-titan-drill.name=Titan Drill
block.cryogenic-frontiers-titan-drill.description=A colossal industrial excavation platform capable of fracturing the hardest geological formations. Features extreme mining throughput across a massive 5x5 survey footprint, boosted with Chilled Water.

# Blocks - Turrets
block.cryogenic-frontiers-frostbite.name=Frostbite
block.cryogenic-frontiers-frostbite.description=A rapid-firing cryogenic rail turret. Shoots piercing sub-zero crystal shards or dense shale rounds that inflict freezing status on ground and aerial targets.

block.cryogenic-frontiers-permafrost.name=Permafrost
block.cryogenic-frontiers-permafrost.description=A heavy siege mortar firing volatile cryogenic shells. Detonates on impact into a cluster of piercing frost fragments, crushing enemy formations.

block.cryogenic-frontiers-absolute-zero.name=Absolute Zero
block.cryogenic-frontiers-absolute-zero.description=Focuses a sustained, high-energy cryogenic beam that pierces through multiple enemies, dealing heavy thermal shock damage and freezing them in place.

block.cryogenic-frontiers-glacialis.name=Glacialis
block.cryogenic-frontiers-glacialis.description=A massive, ultra-long-range cryogenic railgun. Accelerates superconducting Cryo-Alloy hyper-slugs to hypersonic velocities, piercing clean through multiple armored titans.

block.cryogenic-frontiers-blizzard.name=Blizzard
block.cryogenic-frontiers-blizzard.description=A multi-barrel rotary cryogenic storm cannon. Unleashes a devastating torrent of supercooled flechettes that push back assault waves with violent knockback.

block.cryogenic-frontiers-avalanche.name=Avalanche
block.cryogenic-frontiers-avalanche.description=A heavy guided missile platform. Launches long-range cryogenic torpedoes that actively track agile targets and burst into sub-zero cluster warheads.

# Blocks - Power
block.cryogenic-frontiers-thermo-stirling-engine.name=Thermo-Stirling Engine
block.cryogenic-frontiers-thermo-stirling-engine.description=Generates clean high-output electrical energy by combusting volatile Boreonite fuel within an insulated Stirling expansion chamber.

block.cryogenic-frontiers-zero-point-reactor.name=Zero-Point Cryo-Reactor
block.cryogenic-frontiers-zero-point-reactor.description=A monumental power complex. Harnesses the zero-point thermal vacuum created by compressing Cryo-Alloy within continuous Chilled Water coolant baths to generate 3,600 power/sec.

# Blocks - Defense & Fortifications
block.cryogenic-frontiers-glacite-wall.name=Glacite Wall
block.cryogenic-frontiers-glacite-wall.description=A solid perimeter wall forged from Glacite plates. Protects vulnerable base structures from light projectile impacts.

block.cryogenic-frontiers-glacite-wall-large.name=Large Glacite Wall
block.cryogenic-frontiers-glacite-wall-large.description=A fortified double-thick Glacite blast barrier. Provides durable early-to-midgame defensive containment.

block.cryogenic-frontiers-cryo-wall.name=Cryo Wall
block.cryogenic-frontiers-cryo-wall.description=A fortified defense wall infused with Cryo-Crystals. Cools incoming heat and erupts in a sub-zero freeze shockwave when destroyed, neutralizing nearby attackers.

block.cryogenic-frontiers-cryo-wall-large.name=Large Cryo Wall
block.cryogenic-frontiers-cryo-wall-large.description=A multi-layered cryogenic barricade. Deflects small projectiles and releases a massive freezing nova when breached.

block.cryogenic-frontiers-shielded-cryo-wall.name=Shielded Cryo Wall
block.cryogenic-frontiers-shielded-cryo-wall.description=A high-tier superconducting defense wall forged from Cryo-Alloy plates. Boasts extreme structural durability, high inherent armor, and a high probability to deflect enemy projectiles.

block.cryogenic-frontiers-shielded-cryo-wall-large.name=Large Shielded Cryo Wall
block.cryogenic-frontiers-shielded-cryo-wall-large.description=A colossal superconducting bastion composed of thick Cryo-Alloy composites. Deflects heavy caliber rounds and withstands extreme frontal assault.

# Distribution - Solid
block.cryogenic-frontiers-cryo-conveyor.name=Cryo Conveyor
block.cryogenic-frontiers-cryo-conveyor.description=A low-friction cryogenic conveyor belt. Infused with Glacite plates to reduce friction, allowing items to slide rapidly while maintaining zero vanilla resource reliance.

block.cryogenic-frontiers-cryo-router.name=Cryo Router
block.cryogenic-frontiers-cryo-router.description=Evenly splits incoming items in three directions. Enhanced with a cryogenic frictionless manifold to prevent item stalling.

block.cryogenic-frontiers-cryo-distributor.name=Cryo Distributor
block.cryogenic-frontiers-cryo-distributor.description=A large 2x2 multi-directional distributor. Splits incoming items evenly across all adjacent outputs using a refrigerated sorting core.

block.cryogenic-frontiers-cryo-junction.name=Cryo Junction
block.cryogenic-frontiers-cryo-junction.description=Crosses two perpendicular conveyor belts without item mixing. Features supercooled low-friction tunnels for rapid passage.

block.cryogenic-frontiers-cryo-bridge.name=Cryo Bridge
block.cryogenic-frontiers-cryo-bridge.description=Transports items over terrain, structures, and belts up to a distance of 5 tiles. Cryogenic magnetic rails provide accelerated flight times.

# Distribution - Liquid
block.cryogenic-frontiers-cryo-conduit.name=Cryo Conduit
block.cryogenic-frontiers-cryo-conduit.description=A super-insulated cryogenic fluid duct forged from Cryo-Glass and Glacite. Transports liquids at elevated velocity and pressure without leaks. Does not accept side liquid inputs.

block.cryogenic-frontiers-cryo-liquid-router.name=Cryo Liquid Router
block.cryogenic-frontiers-cryo-liquid-router.description=Evenly distributes liquids to surrounding blocks. Insulated with Cryo-Glass and Glacite to maintain fluid temperature and avoid pressure loss.

block.cryogenic-frontiers-cryo-liquid-tank.name=Cryo Liquid Tank
block.cryogenic-frontiers-cryo-liquid-tank.description=A compact 2x2 cryogenic reservoir. Stores large volumes of liquids under vacuum refrigeration.

block.cryogenic-frontiers-cryo-liquid-junction.name=Cryo Liquid Junction
block.cryogenic-frontiers-cryo-liquid-junction.description=Allows two perpendicular liquid pipelines to cross without mixing. Reinforced with Cryo-Glass and Glacite seals.

block.cryogenic-frontiers-cryo-liquid-bridge.name=Cryo Liquid Bridge
block.cryogenic-frontiers-cryo-liquid-bridge.description=Transports fluids over terrain, structures, and conduits up to 5 tiles away via pressurized magnetic cryogenic tubes.

# Liquids
liquid.cryogenic-frontiers-chilled-water.name=Chilled Water
liquid.cryogenic-frontiers-chilled-water.description=Water supercooled near its freezing point. Absorbs heat significantly faster than ordinary coolant, acting as an efficient coolant for weapons and machinery.

# Units & Unit Production
block.cryogenic-frontiers-cryo-unit-factory.name=Cryo Unit Factory
block.cryogenic-frontiers-cryo-unit-factory.description=Manufactures advanced cryogenic combat units. Assembles reinforced airframes and components infused with Cryo-Crystals.

unit.cryogenic-frontiers-boreas.name=Boreas
unit.cryogenic-frontiers-boreas.description=An agile cryogenic assault interceptor. Fires high-velocity freeze bolts that slow and damage enemy units.

unit.cryogenic-frontiers-frost-alpha.name=Frost Alpha
unit.cryogenic-frontiers-frost-alpha.description=A cryogenic starting core unit. Upgraded with sub-zero mining emitters and rapid construction beams. Mines faster, builds quicker, and defends itself with chilling energy bolts.

# Core Command
block.cryogenic-frontiers-core-frost.name=Core: Frost
block.cryogenic-frontiers-core-frost.description=Primary command center for cryogenic expeditionary forces. Stores materials and spawns the Frost Alpha builder unit. Heavily armored and reinforced with cryogenic plating.

# Planet - Nivalis
planet.cryogenic-frontiers-nivalis.name=Nivalis
planet.cryogenic-frontiers-nivalis.description=A sub-zero terrestrial world enveloped in perpetual blizzards and glacial permafrost. Rich in volatile cryo-hydrocarbons, dense metallic ores, and crystalline minerals.

# Sectors - Nivalis Campaign
sector.cryogenic-frontiers-boreal-basin.name=Boreal Basin
sector.cryogenic-frontiers-boreal-basin.description=Initial expeditionary landing zone on Nivalis. A sheltered glacial basin with rich surface deposits of Glacite and Cryo-Shale. Establish a fortified perimeter and secure power generation.

sector.cryogenic-frontiers-quartz-valley.name=Quartz Valley
sector.cryogenic-frontiers-quartz-valley.description=High-altitude glacial rift dense with pure Polar Quartz crystal outcroppings and subterranean Boreonite deposits. Establish semiconductor and tempered glass refining outposts.

sector.cryogenic-frontiers-subzero-crags.name=Subzero Crags
sector.cryogenic-frontiers-subzero-crags.description=Rugged frozen mountain crags with treacherous choke points and abundant deep-layer ore veins. Establish industrial Cryo-Alloy foundries while repelling relentless mechanized assaults.

sector.cryogenic-frontiers-glacial-citadel.name=Glacial Citadel
sector.cryogenic-frontiers-glacial-citadel.description=The planetary hostile command bastion on Nivalis. Features 2 heavily fortified enemy cores protected by heavy bastions, turrets, and automated unit production. Infiltrate and eradicate both enemy command cores to secure planetary dominance.

# Environment - Terrain & Props
block.cryogenic-frontiers-frost-stone.name=Frost Stone
block.cryogenic-frontiers-frost-stone.description=Dense permafrost bedrock underlying the glacial sheets of Nivalis.

block.cryogenic-frontiers-permafrost-ice.name=Permafrost Ice
block.cryogenic-frontiers-permafrost-ice.description=Smooth, hard-packed crystalline ice. Increases unit velocity while reducing friction.

block.cryogenic-frontiers-glacial-snow.name=Glacial Snow
block.cryogenic-frontiers-glacial-snow.description=Deep, soft sub-zero snow crust. Impedes unit movement speed.

block.cryogenic-frontiers-frost-stone-wall.name=Frost Stone Wall
block.cryogenic-frontiers-frost-stone-wall.description=Impassable mountain wall of frozen bedrock.

block.cryogenic-frontiers-permafrost-ice-wall.name=Permafrost Ice Wall
block.cryogenic-frontiers-permafrost-ice-wall.description=Impassable glacial cliff composed of solid ancient ice.

block.cryogenic-frontiers-cryo-boulder.name=Cryo Boulder
block.cryogenic-frontiers-cryo-boulder.description=A frost-covered boulder fragment.

